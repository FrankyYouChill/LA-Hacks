name: Workshop checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.stage }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        stage: [01-basic-agent, 02-multimodal-agent]
    defaults:
      run:
        working-directory: voice-agent/${{ matrix.stage }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: voice-agent/${{ matrix.stage }}/.nvmrc
          cache: npm
          cache-dependency-path: voice-agent/${{ matrix.stage }}/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npm run check
      - name: Run offline tests
        run: npm test
